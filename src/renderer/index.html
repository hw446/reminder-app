<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Reminder Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow-orb one"></div>
<div class="glow-orb two"></div>

<div class="panel">
  <!-- Traffic lights handled natively via hiddenInset, padding for drag region -->
  <div class="titlebar">
    <span class="app-title">Reminder Assistant</span>
  </div>

  <section class="section">
    <span class="label">Reminder Message</span>
    <textarea class="reminder-input" id="msgInput"
      placeholder="Enter your reminder…&#10;Example: Take a break ♨️"
      maxlength="200"></textarea>
    <div class="char-count"><span id="charCount">0</span> / 200</div>
  </section>

  <section class="section">
    <span class="label">Reminder Interval</span>
    <div class="interval-row">
      <div class="interval-display" id="intervalDisplay">25</div>
      <div class="interval-controls">
        <button class="btn-step" id="btnUp">▲</button>
        <button class="btn-step" id="btnDown">▼</button>
      </div>
      <span class="interval-suffix">minutes / alert</span>
    </div>

    <div class="presets">
      <button class="preset-btn" data-val="5">5 min</button>
      <button class="preset-btn" data-val="10">10 min</button>
      <button class="preset-btn" data-val="30">30 min</button>
      <button class="preset-btn active" data-val="45">45 min</button>
      <button class="preset-btn" data-val="60">60 min</button>
    </div>
  </section>

  <div class="divider"></div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Not started</span>
    <span class="countdown" id="countdown"></span>
  </div>

  <div class="btn-row">
    <button class="btn-secondary" id="btnTest" title="Preview full-screen reminder">Test</button>
    <button class="btn-main" id="btnMain">Start Reminder</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
